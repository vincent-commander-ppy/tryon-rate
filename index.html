<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vincent 真人协作任务</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f6f6f6; color: #222; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 20px; margin: 8px 0; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin: 10px 0; }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .meta { font-size: 13px; color: #666; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #dcfce7; color: #166534; }
  .tag.closed { background: #eee; color: #888; }
  ol { padding-left: 20px; } li { margin: 4px 0; }
  .big { display: block; width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; text-align: center; text-decoration: none; box-sizing: border-box; }
  .sec { background: #ddd; color: #222; margin-top: 8px; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vincent 真人协作任务</h1>
  <p class="meta">这里列出项目需要真人帮忙的事。选一个，点「下一步」看怎么做，再点「开始」。</p>
  <div id="list"></div>
  <div id="detail" class="hide"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tasks = [];
function showList() {
  $("detail").classList.add("hide"); $("list").classList.remove("hide");
  const open = tasks.filter(t => t.status === "open"), done = tasks.filter(t => t.status !== "open");
  $("list").innerHTML = (open.length ? "" : '<div class="card">现在没有需要帮忙的任务，谢谢。</div>') +
    open.concat(done).map(t => `<div class="card">
      <span class="tag ${t.status === "open" ? "" : "closed"}">${t.status === "open" ? "进行中" : "已结束"}</span>
      <h2>${esc(t.title)}</h2>
      <div class="meta">约 ${esc(t.minutes)} 分钟${t.deadline ? " · 截止 " + esc(t.deadline) : ""}</div>
      <p>${esc(t.why)}</p>
      ${t.status === "open" ? `<button class="big" onclick="showTask('${esc(t.id)}')">下一步</button>` : ""}
    </div>`).join("");
}
function showTask(id) {
  const t = tasks.find(x => x.id === id);
  $("list").classList.add("hide"); $("detail").classList.remove("hide");
  $("detail").innerHTML = `<div class="card">
    <h2>${esc(t.title)}</h2>
    <div class="meta">约 ${esc(t.minutes)} 分钟${t.deadline ? " · 截止 " + esc(t.deadline) : ""}</div>
    <p><b>谁可以做：</b>${esc(t.who)}</p>
    <p><b>为什么需要你：</b>${esc(t.why)}</p>
    <p><b>怎么做：</b></p>
    <ol>${t.steps.map(s => "<li>" + esc(s) + "</li>").join("")}</ol>
    <p><b>做完以后：</b>${esc(t.report)}</p>
    ${t.start_url ? `<a class="big" href="${esc(t.start_url)}">开始</a>` : ""}
    <button class="big sec" onclick="showList()">返回任务列表</button>
  </div>`;
  scrollTo(0, 0);
}
fetch("tasks.json?" + Date.now()).then(r => r.json()).then(j => { tasks = j; showList(); })
  .catch(() => { $("list").innerHTML = '<div class="card">任务列表加载失败，请刷新。</div>'; });
</script>
</body>
</html>
